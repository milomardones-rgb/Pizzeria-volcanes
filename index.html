<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pizzería Volcanes - Datos de Transferencia</title>
<style>
:root{--bg:#11100e;--card:#1b1a18;--gold:#e3b52f;--text:#f5f5f5;--muted:#99958d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:520px;margin:auto;padding:28px 18px 36px}
h1{text-align:center;font-size:25px;margin:4px 0 8px}
.sub{text-align:center;color:#aaa;margin-bottom:22px;font-size:15px}
.copyall{width:100%;border:0;border-radius:18px;background:var(--gold);color:#111;padding:18px;font-weight:800;font-size:17px;letter-spacing:.5px;margin-bottom:22px}
.card{background:var(--card);border:1px solid #25231f;border-radius:22px;padding:18px 18px 20px;margin:12px 0;position:relative}
.label{color:#8e8a82;font-size:12px;font-weight:700;letter-spacing:1px;margin-bottom:9px}
.value{font-size:18px;font-weight:700;line-height:1.35;padding-right:42px;word-break:break-word}
.copy{position:absolute;right:17px;top:19px;background:none;border:0;color:#aaa;font-size:23px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{text-align:center;color:#bbb;font-size:13px;line-height:1.5;margin:26px 8px 0}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#e3b52f;color:#111;padding:12px 18px;border-radius:12px;font-weight:700;display:none}
</style>
</head>
<body>
<div class="wrap">
<h1>Datos de Transferencia</h1>
<div class="sub">Pizzería Volcanes</div>
<button class="copyall" onclick="copyAll()">▣ &nbsp; COPIAR TODOS LOS DATOS</button>

<div class="card">
<div class="label">DESTINATARIO</div>
<div class="value" id="titular">PASCAL PEREDA</div>
<button class="copy" onclick="copy('titular')">▢</button>
</div>

<div class="card">
<div class="label">RUT</div>
<div class="value" id="rut">17.517.168-1</div>
<button class="copy" onclick="copy('rut')">▢</button>
</div>

<div class="grid">
<div class="card">
<div class="label">BANCO</div>
<div class="value" id="banco">Tenpo</div>
</div>
<div class="card">
<div class="label">TIPO CUENTA</div>
<div class="value" id="tipo">Cuenta Vista</div>
</div>
</div>

<div class="card">
<div class="label">NÚMERO DE CUENTA</div>
<div class="value" id="cuenta">111117517168</div>
<button class="copy" onclick="copy('cuenta')">▢</button>
</div>

<div class="card">
<div class="label">CORREO ELECTRÓNICO</div>
<div class="value" id="correo">pascal.pereda@gmail.com</div>
<button class="copy" onclick="copy('correo')">▢</button>
</div>

<div class="note">Una vez realizada la transferencia, por favor conserva tu comprobante.</div>
<div class="toast" id="toast">¡Copiado!</div>
</div>

<script>
const vals={titular:"PASCAL PEREDA",rut:"17.517.168-1",correo:"pascal.pereda@gmail.com",banco:"Tenpo",tipo:"Cuenta Vista",cuenta:"111117517168"};
function show(){const t=document.getElementById('toast');t.style.display='block';setTimeout(()=>t.style.display='none',1600)}
function copy(id){navigator.clipboard.writeText(document.getElementById(id).innerText).then(show)}
function copyAll(){const txt=`${vals.titular}\n${vals.rut}\n${vals.correo}\n${vals.banco}\n${vals.tipo}\n${vals.cuenta}`;navigator.clipboard.writeText(txt).then(show)}
</script>
</body>
</html>
